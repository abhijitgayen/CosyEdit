[package]
name = "cosyedit_runtime"
version = "0.1.0"
edition = "2021"
authors = ["CosyEdit Team"]
description = "Lightweight, optimized, cross-platform Rust runtime server for CosyEdit & CosyVoice with parallel request execution."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tonic = "0.11"
prost = "0.12"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1.6"
clap = { version = "4.5", features = ["derive"] }
tokio-stream = "0.1"
ort = { version = "2.0.0-rc.9", features = ["copy-dylibs"] }
ndarray = "0.16"

[build-dependencies]
tonic-build = "0.11"
